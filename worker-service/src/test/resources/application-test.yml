# ============================================================
# ComicAtlas Worker Service — 集成测试 profile
# 强制只读：datasource 通过 spring.datasource.hikari.readOnly=true
# 和 MySQL 权限层 GRANT SELECT 双重保障。
# ============================================================

spring:
  application:
    name: comic-worker-service-test
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    # Worker 账号只读 — MySQL 层 GRANT SELECT ON comic_atlas_test.* TO 'worker_user'
    url: jdbc:mysql://localhost:3306/comic_atlas_test?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: worker_user
    password: worker_test_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      read-only: true
      maximum-pool-size: 2
  rabbitmq:
    host: localhost
    port: 5672
    username: test_rabbit
    password: test_rabbit_pass
    listener:
      simple:
        auto-startup: false
  data:
    redis:
      host: localhost
      port: 6379
      password: ""

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# Worker 使用临时目录作为 manga-root
worker:
  manga-root: ${java.io.tmpdir}/comicatlas-test/manga
  temp-dir: ${java.io.tmpdir}/comicatlas-test/manga/temp
  metadata-dir: ${java.io.tmpdir}/comicatlas-test/manga/metadata
  aria2c-path: /nonexistent/aria2c
  ffprobe-path: /nonexistent/ffprobe
  ffmpeg-path: /nonexistent/ffmpeg
  image-optimizer-path: /nonexistent/image-optimizer
  lq-quality: 15
  lq-workers: 1
  hq-delete-timeout-seconds: 10
  ffprobe-enabled: false
  torrent:
    peer-detect-timeout: 5
    min-speed-threshold: 10240
    speed-check-duration: 60
  proxy:
    host: 127.0.0.1
    port: 0
    socks-port: 0
  cover:
    quality: 25
  zip:
    max-entries: 1000
    max-depth: 10
    split-size: 2147483648
    max-entry-size: 10485760
    max-total-size: 52428800

storage:
  roots:
    HQ:
      type: FILESYSTEM
      path: ${java.io.tmpdir}/comicatlas-test/manga/hq
    LQ:
      type: FILESYSTEM
      path: ${java.io.tmpdir}/comicatlas-test/manga/lq
    EXPORT:
      type: FILESYSTEM
      path: ${java.io.tmpdir}/comicatlas-test/manga/export

logging:
  level:
    root: WARN
    com.comicatlas: INFO
    org.testcontainers: INFO
