server:
  port: 8020

spring:
  application:
    name: comic-worker-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        username: ${NACOS_USER:nacos}
        password: ${NACOS_PASS:nacos}
      config:
        import-check:
          enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: 1
        acknowledge-mode: manual
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/comic_atlas?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

worker:
  manga-root: ${MANGA_ROOT:F:/manga}
  temp-dir: ${MANGA_ROOT:F:/manga}/temp
  metadata-dir: ${MANGA_ROOT:F:/manga}/metadata
  aria2c-path: ${ARIA2C_PATH:tools/aria2c/aria2c.exe}
  ffprobe-path: ${FFPROBE_PATH:tools/ffmpeg/ffprobe.exe}
  ffmpeg-path: ${FFMPEG_PATH:tools/ffmpeg/ffmpeg.exe}
  image-optimizer-path: ${IMAGE_OPTIMIZER_PATH:tools/image-optimizer/image-optimizer.exe}
  lq-quality: ${LQ_QUALITY:15}
  lq-workers: ${LQ_WORKERS:4}
  hq-delete-timeout-seconds: ${HQ_DELETE_TIMEOUT_SECONDS:60}
  ffprobe-enabled: true
  torrent:
    peer-detect-timeout: 30
    min-speed-threshold: 10240
    speed-check-duration: 300
  proxy:
    host: ${PROXY_HOST:127.0.0.1}
    port: ${PROXY_PORT:7897}
    socks-port: ${SOCKS_PORT:7897}
  cover:
    quality: ${COVER_QUALITY:25}
  zip:
    max-entries: 100000
    max-depth: 200
    max-entry-size: 2147483648
    max-total-size: 32212254720

storage:
  roots:
    HQ:
      type: FILESYSTEM
      path: ${MANGA_ROOT:F:/manga}/hq
    LQ:
      type: FILESYSTEM
      path: ${MANGA_ROOT:F:/manga}/lq
    EXPORT:
      type: FILESYSTEM
      path: ${MANGA_ROOT:F:/manga}/export
