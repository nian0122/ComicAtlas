server:
  port: 8000

management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  application:
    name: comic-gateway
  codec:
    max-in-memory-size: 32MB
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR}
        username: ${NACOS_USER}
        password: ${NACOS_PASS}
    gateway:
      # 统一由网关处理跨域；生产环境可通过 CORS_ALLOWED_ORIGINS 覆盖允许的前端来源。
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
            allowed-methods: '*'
            allowed-headers: '*'
            allow-credentials: true
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # 管理端路由：/api/manage/** → 管理服务（必须先于阅读路由声明，避免被 /api/** 吞掉）
        - id: management-service
          uri: lb://comic-api-service
          predicates:
            - Path=/api/manage/**
        # AI 分析路由：/api/ai/** → AI 单体
        - id: ai-service
          uri: http://comic-ai-service:8020
          predicates:
            - Path=/api/ai/**
        # 阅读端路由：/api/** → 阅读服务（只读为主 + 阅读进度保存）
        - id: reading-service
          uri: lb://comic-reading-service
          predicates:
            - Path=/api/**
