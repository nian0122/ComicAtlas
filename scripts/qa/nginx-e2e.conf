# ============================================================
# ComicAtlas QA E2E Nginx 配置（生成物，由 runner 挂载进 QA 容器）
# 与仓库 nginx.conf 行为一致，仅把上游从容器内 gateway 改为宿主 gateway。
# 上游用 gateway-host（compose extra_hosts -> host-gateway，强制 IPv4）；
# /files/* -> 宿主临时 MANGA_ROOT 挂载点。
# ============================================================
worker_processes 2;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/css application/javascript application/json;

    server {
        listen 80;
        client_max_body_size 20m;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://gateway-host:18000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /files/hq/ {
            alias /storage/hq/;
            # 视频需要支持 Range，并允许浏览器保留已请求字节，避免
            # 虚拟滚动回收 video 后再次滑回时从头请求。
            add_header Accept-Ranges bytes always;
            add_header Cache-Control "private, no-cache" always;
        }

        location /files/lq/ {
            alias /storage/lq/;
            try_files $uri @lq_not_found;
            expires 30d;
        }

        location @lq_not_found { return 204; }

        location /files/thumbs/ {
            alias /storage/thumbs/;
            expires 7d;
        }
    }
}
