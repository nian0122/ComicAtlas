# ============================================================
# ComicAtlas API Service — 集成测试 profile
# 使用 Testcontainers 动态端口，本文件提供基础默认值；
# Testcontainers 会在 Spring 启动前通过 @DynamicPropertySource 覆盖。
# Flyway 管理 schema，替代 sql.init。
# ============================================================

spring:
  application:
    name: comic-api-service-test
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  task:
    scheduling:
      enabled: false
  datasource:
    # 默认回退 — DatabaseMigrationTest 使用 Testcontainers JDBC TC URL
    # SpringBootTest 集成测试由 @DynamicPropertySource 覆盖
    url: jdbc:mysql://localhost:3306/comic_atlas_test?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: api_user
    password: api_test_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/flyway
    baseline-on-migrate: true
    baseline-version: 1
  rabbitmq:
    host: localhost
    port: 5672
    username: test_rabbit
    password: test_rabbit_pass
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        auto-startup: false
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
  security:
    enabled: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

comic:
  cache:
    catalog-ttl: 1s

logging:
  level:
    root: WARN
    com.comicatlas: INFO
    org.testcontainers: INFO
    org.flywaydb: DEBUG
