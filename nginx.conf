worker_processes 2;
events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 valid=10s ipv6=off;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/css application/javascript application/json;

    server {
        listen 80;
        client_max_body_size 20m;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            set $gateway_upstream http://gateway:8000;
            proxy_pass $gateway_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /files/hq/ {
            alias /storage/hq/;
            # Safari 依赖 HTTP Range 分段读取 MP4 的 moov/媒体数据。
            # Nginx 静态文件默认支持 Range，但显式返回该响应头可避免
            # 代理或后续配置覆盖后导致 Safari 放弃预加载。
            add_header Accept-Ranges bytes always;
            expires 60d;
        }

        location /files/lq/ {
            alias /storage/lq/;
            try_files $uri @lq_not_found;
            expires 30d;
        }

        location @lq_not_found { return 204; }

        location /files/thumbs/ {
            alias /storage/thumbs/;
            expires 7d;
        }
    }
}
