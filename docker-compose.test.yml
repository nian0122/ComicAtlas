# ============================================================
# ComicAtlas 集成测试 Compose — 测试专用凭据/端口，独立于生产环境
# ============================================================
services:
  mysql:
    image: mysql:8.0
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: test_root_pass_2024
      MYSQL_DATABASE: comic_atlas_test
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=32M
      - --max-connections=20
      - --performance-schema=OFF
      - --skip-name-resolve
    ports:
      - "0:3306"  # 随机端口，避免与生产 3306 冲突
    volumes:
      - ./api-service/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./api-service/src/test/resources/sql/init-test-users.sql:/docker-entrypoint-initdb.d/02-users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -ptest_root_pass_2024 --silent"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: "no"
    environment:
      RABBITMQ_DEFAULT_USER: test_rabbit
      RABBITMQ_DEFAULT_PASS: test_rabbit_pass
    ports:
      - "0:5672"   # AMQP 随机端口
      - "0:15672"  # Management 随机端口
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
