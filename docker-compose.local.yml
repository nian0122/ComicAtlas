# 与 docker-compose.infra.yml、docker-compose.yml 一起使用，让容器直接通过服务名连接本机基础设施。
services:
  gateway:
    environment:
      NACOS_ADDR: nacos:8848
      NACOS_USER: ""
      NACOS_PASS: ""
  api-service:
    environment:
      NACOS_ADDR: nacos:8848
      NACOS_USER: ""
      NACOS_PASS: ""
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_MANAGEMENT_PORT: 15672
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  reading-service:
    environment:
      NACOS_ADDR: nacos:8848
      NACOS_USER: ""
      NACOS_PASS: ""
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      api-service:
        condition: service_healthy
  worker-service:
    environment:
      NACOS_ADDR: nacos:8848
      NACOS_USER: ""
      NACOS_PASS: ""
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    depends_on:
      api-service:
        condition: service_healthy
  comic-ai-service:
    environment:
      AI_DB_HOST: mysql
      AI_DB_PORT: 3306
    depends_on:
      api-service:
        condition: service_healthy
