services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    mem_limit: 512m
    container_name: comicatlas-gateway
    restart: unless-stopped
    extra_hosts:
      # Docker Desktop 可能将 host.docker.internal 解析为不可达 IPv6；Nacos gRPC 必须固定走宿主 IPv4。
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      NACOS_ADDR: ${REMOTE_INFRA_HOST:?请设置 REMOTE_INFRA_HOST}:${REMOTE_NACOS_HTTP_PORT:?请设置 REMOTE_NACOS_HTTP_PORT}
      NACOS_USER: ${REMOTE_NACOS_USER:?请设置 REMOTE_NACOS_USER}
      NACOS_PASS: ${REMOTE_NACOS_PASSWORD:?请设置 REMOTE_NACOS_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8000/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-service:
    build:
      context: .
      dockerfile: api-service/Dockerfile
    mem_limit: 768m
    container_name: comicatlas-api
    restart: unless-stopped
    extra_hosts:
      # Docker Desktop 可能将 host.docker.internal 解析为不可达 IPv6；Nacos gRPC 必须固定走宿主 IPv4。
      - "host.docker.internal:host-gateway"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
      NACOS_ADDR: ${REMOTE_INFRA_HOST:?请设置 REMOTE_INFRA_HOST}:${REMOTE_NACOS_HTTP_PORT:?请设置 REMOTE_NACOS_HTTP_PORT}
      NACOS_USER: ${REMOTE_NACOS_USER:?请设置 REMOTE_NACOS_USER}
      NACOS_PASS: ${REMOTE_NACOS_PASSWORD:?请设置 REMOTE_NACOS_PASSWORD}
      MYSQL_HOST: ${REMOTE_INFRA_HOST:?请设置 REMOTE_INFRA_HOST}
      MYSQL_PORT: ${REMOTE_MYSQL_PORT:?请设置 REMOTE_MYSQL_PORT}
      MYSQL_USER: ${API_MYSQL_USER:?请在 .env 中设置 API_MYSQL_USER}
      MYSQL_PASS: ${API_MYSQL_PASSWORD:?请在 .env 中设置 API_MYSQL_PASSWORD}
      REDIS_HOST: ${REMOTE_INFRA_HOST:?请设置 REMOTE_INFRA_HOST}
      REDIS_PORT: ${REMOTE_REDIS_PORT:?请设置 REMOTE_REDIS_PORT}
      REDIS_PASS: ${REMOTE_REDIS_PASSWORD:?请设置 REMOTE_REDIS_PASSWORD}
      RABBITMQ_HOST: ${REMOTE_INFRA_HOST:?请设置 REMOTE_INFRA_HOST}
      RABBITMQ_PORT: ${REMOTE_RABBITMQ_PORT:?请设置 REMOTE_RABBITMQ_PORT}
      RABBITMQ_MANAGEMENT_PORT: ${REMOTE_RABBITMQ_MANAGEMENT_PORT:?请设置 REMOTE_RABBITMQ_MANAGEMENT_PORT}
      RABBITMQ_USER: ${REMOTE_RABBITMQ_USER:?请设置 REMOTE_RABBITMQ_USER}
      RABBITMQ_PASS: ${REMOTE_RABBITMQ_PASSWORD:?请设置 REMOTE_RABBITMQ_PASSWORD}
      SPRING_SECURITY_USER_NAME: ${REMOTE_RABBITMQ_USER:?请设置 REMOTE_RABBITMQ_USER}
      SPRING_SECURITY_USER_PASSWORD: ${REMOTE_RABBITMQ_PASSWORD:?请设置 REMOTE_RABBITMQ_PASSWORD}
      MANGA_ROOT: /storage
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8010/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - ${MANGA_ROOT:-./manga}/metadata:/storage/metadata:ro
      - ${MANGA_ROOT:-./manga}/hq:/storage/hq:ro
      - ${MANGA_ROOT:-./manga}/lq:/storage/lq:ro
      - ${MANGA_ROOT:-./manga}/thumbs:/storage/thumbs:ro
      - ${MANGA_ROOT:-./manga}/staging:/storage/staging
      - ${MANGA_ROOT:-./manga}/trash:/storage/trash:ro

  reading-service:
    build:
      context: .
      dockerfile: reading-service/Dockerfile
    mem_limit: 640m
    container_name: comicatlas-reading
    restart: unless-stopped
    extra_hosts:
      # Docker Desktop 可能将 host.docker.internal 解析为不可达 IPv6；Nacos gRPC 必须固定走宿主 IPv4。
      - "host.docker.internal:host-gateway"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx320m"
      NACOS_ADDR: ${REMOTE_INFRA_HOST:?请设置 REMOTE_INFRA_HOST}:${REMOTE_NACOS_HTTP_PORT:?请设置 REMOTE_NACOS_HTTP_PORT}
      NACOS_USER: ${REMOTE_NACOS_USER:?请设置 REMOTE_NACOS_USER}
      NACOS_PASS: ${REMOTE_NACOS_PASSWORD:?请设置 REMOTE_NACOS_PASSWORD}
      MYSQL_HOST: ${REMOTE_INFRA_HOST:?请设置 REMOTE_INFRA_HOST}
      MYSQL_PORT: ${REMOTE_MYSQL_PORT:?请设置 REMOTE_MYSQL_PORT}
      # 阅读服务写入阅读进度（reading_history），需使用具备读写权限的 API 账号
      MYSQL_USER: ${API_MYSQL_USER:?请在 .env 中设置 API_MYSQL_USER}
      MYSQL_PASS: ${API_MYSQL_PASSWORD:?请在 .env 中设置 API_MYSQL_PASSWORD}
      REDIS_HOST: ${REMOTE_INFRA_HOST:?请设置 REMOTE_INFRA_HOST}
      REDIS_PORT: ${REMOTE_REDIS_PORT:?请设置 REMOTE_REDIS_PORT}
      REDIS_PASS: ${REMOTE_REDIS_PASSWORD:?请设置 REMOTE_REDIS_PASSWORD}
      MANGA_ROOT: /storage
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8011/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - ${MANGA_ROOT:-./manga}/metadata:/storage/metadata:ro
      - ${MANGA_ROOT:-./manga}/hq:/storage/hq:ro
      - ${MANGA_ROOT:-./manga}/lq:/storage/lq:ro
      - ${MANGA_ROOT:-./manga}/thumbs:/storage/thumbs:ro
  worker-service:
    build:
      context: .
      dockerfile: worker-service/Dockerfile
    # JVM 与四路图片解码/WebP 编码共用容器内存；像素预算会对大图自动降并发。
    mem_limit: 2g
    container_name: comicatlas-worker
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
      NACOS_ADDR: ${REMOTE_INFRA_HOST:?请设置 REMOTE_INFRA_HOST}:${REMOTE_NACOS_HTTP_PORT:?请设置 REMOTE_NACOS_HTTP_PORT}
      NACOS_USER: ${REMOTE_NACOS_USER:?请设置 REMOTE_NACOS_USER}
      NACOS_PASS: ${REMOTE_NACOS_PASSWORD:?请设置 REMOTE_NACOS_PASSWORD}
      RABBITMQ_HOST: ${REMOTE_INFRA_HOST:?请设置 REMOTE_INFRA_HOST}
      RABBITMQ_PORT: ${REMOTE_RABBITMQ_PORT:?请设置 REMOTE_RABBITMQ_PORT}
      RABBITMQ_USER: ${REMOTE_RABBITMQ_USER:?请设置 REMOTE_RABBITMQ_USER}
      RABBITMQ_PASS: ${REMOTE_RABBITMQ_PASSWORD:?请设置 REMOTE_RABBITMQ_PASSWORD}
      MYSQL_HOST: ${REMOTE_INFRA_HOST:?请设置 REMOTE_INFRA_HOST}
      MYSQL_PORT: ${REMOTE_MYSQL_PORT:?请设置 REMOTE_MYSQL_PORT}
      MYSQL_USER: ${WORKER_MYSQL_USER:?请在 .env 中设置 WORKER_MYSQL_USER}
      MYSQL_PASS: ${WORKER_MYSQL_PASSWORD:?请在 .env 中设置 WORKER_MYSQL_PASSWORD}
      REDIS_HOST: ${REMOTE_INFRA_HOST:?请设置 REMOTE_INFRA_HOST}
      REDIS_PORT: ${REMOTE_REDIS_PORT:?请设置 REMOTE_REDIS_PORT}
      REDIS_PASS: ${REMOTE_REDIS_PASSWORD:?请设置 REMOTE_REDIS_PASSWORD}
      MANGA_ROOT: /storage
      # 前端/API 传入宿主机路径时，Worker 将其映射到容器内的共享存储路径。
      WORKER_HOST_MANGA_ROOT: ${MANGA_ROOT:-./manga}
      WORKER_CONTAINER_MANGA_ROOT: /storage
      ARIA2C_PATH: /usr/bin/aria2c
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      IMAGE_OPTIMIZER_PATH: /opt/comicatlas/tools/image-optimizer
      LQ_WORKERS: ${LQ_WORKERS:-4}
      LQ_MAX_INFLIGHT_PIXELS: ${LQ_MAX_INFLIGHT_PIXELS:-80000000}
    volumes:
      # 整个 MANGA_ROOT 共享，既保证导入源路径可见，也覆盖 HQ/LQ/临时/回收站/导出目录。
      - ${MANGA_ROOT:-./manga}:/storage

  nginx:
    build: ./frontend
    mem_limit: 128m
    container_name: comicatlas-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${MANGA_ROOT:-./manga}/hq:/storage/hq:ro
      - ${MANGA_ROOT:-./manga}/lq:/storage/lq:ro
      - ${MANGA_ROOT:-./manga}/thumbs:/storage/thumbs:ro
    healthcheck:
      # 容器内 localhost 仅解析为 IPv6 ::1，而 nginx.conf 的 listen 80 只监听 IPv4，必须显式用 127.0.0.1
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      gateway:
        condition: service_healthy
